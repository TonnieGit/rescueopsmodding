<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rescue Ops Mod Launcher</title>
<style>
@font-face { font-family: "Bebas Neue"; src: url("bebas.woff2") format("woff2"); font-display: block; }
@font-face { font-family: "Rubik"; src: url("rubik.woff2") format("woff2"); font-weight: 300 900; font-display: block; }
:root {
  --bg: #0b0a0a; --panel: rgba(26,22,22,.58); --bar: rgba(255,255,255,.04); --line: rgba(255,255,255,.08);
  --ink: #ece7e5; --muted: #9a918e; --red: #e92125; --amber: #e9a23b;
  --display: "Bebas Neue", "Arial Narrow", Impact, sans-serif; --body: "Rubik", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.4 var(--body); overflow: hidden; user-select: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 1px; }
a { color: inherit; }
.backdrop { position: fixed; inset: 0; z-index: -1; background: #0b0a0a url("backdrop.jpg") center / cover no-repeat; }
.backdrop::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,9,9,.25), rgba(10,9,9,.6)); }
.flat .backdrop { background: #121010; }
.app { display: grid; grid-template-columns: 240px 1fr; grid-template-rows: 1fr 28px; height: 100%; }

/* glass */
.glass-pane { background: rgba(18,15,15,.5); backdrop-filter: blur(24px) saturate(140%); }
.flat .glass-pane, .flat .panel, .flat .dlg, .flat .toast { backdrop-filter: none; background: #1a1717; }

/* sidebar */
.side { grid-row: 1 / 3; border-right: 1px solid var(--line); display: grid; grid-template-rows: auto auto 1fr auto; min-height: 0; }
.brand { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
.brand .fit { font-family: var(--display); line-height: .84; white-space: nowrap; }
.brand .fit.red { color: var(--red); margin-top: 4px; }
.stripe { height: 6px; background: repeating-linear-gradient(135deg, var(--red) 0 10px, #f2eeec 10px 20px); }
.navs { display: grid; padding: 10px 0; align-content: start; }
.nav { font: 26px/1 var(--display); letter-spacing: .04em; color: var(--muted); padding: 9px 12px 7px; margin: 1px 10px; border-radius: 8px;
  display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: none; border: 0; text-align: left; }
.nav:hover { color: var(--ink); background: rgba(255,255,255,.06); }
.nav.on { background: rgba(255,255,255,.14); color: var(--ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.1); }
.nav small { font: 12px var(--body); color: var(--amber); }
.playbox { border-top: 1px solid var(--line); padding: 12px; display: grid; gap: 8px; }
.playbox .info { font-size: 12px; color: var(--muted); }
.play { height: 64px; border: 0; border-radius: 10px; background: var(--red); color: #fff; font: 40px/1 var(--display); letter-spacing: .08em; padding-top: 4px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
.play:hover { background: #ff2a2e; }
.play:disabled { background: #3a3433; color: var(--muted); cursor: default; box-shadow: none; }

/* main */
.main { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
.tabs { display: flex; align-items: flex-end; gap: 2px; padding: 10px 16px 0; border-bottom: 1px solid var(--line); }
.tabs .t { padding: 7px 14px; color: var(--muted); border: 1px solid transparent; border-bottom: 0; background: none; text-transform: uppercase; font-size: 12px; letter-spacing: .06em; border-radius: 8px 8px 0 0; }
.tabs .t.on { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.1); color: var(--ink); margin-bottom: -1px; }
.tabs .right { margin-left: auto; padding-bottom: 7px; color: var(--muted); font-size: 12px; }
.screen { display: none; overflow: auto; min-height: 0; padding: 14px 16px 16px; }
.screen.on { display: block; }
.sub { display: none; } .sub.on { display: block; }

.panel { background: var(--panel); border: 1px solid rgba(255,255,255,.09); border-radius: 10px; overflow: hidden; backdrop-filter: blur(22px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
.panel + .panel { margin-top: 12px; }
.ph { background: var(--bar); border-bottom: 1px solid rgba(255,255,255,.06); padding: 6px 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; align-items: center; gap: 10px; min-height: 30px; }
.ph .r { margin-left: auto; font-weight: 400; text-transform: none; letter-spacing: 0; display: flex; gap: 6px; align-items: center; }
.btn { border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.06); padding: 4px 10px; border-radius: 6px; white-space: nowrap; }
.btn:hover { background: rgba(255,255,255,.11); }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.22); }
.btn.red:hover { background: #ff2a2e; }
.btn:disabled { opacity: .45; cursor: default; }
.warn { color: var(--amber); } .dim { color: var(--muted); } .bad { color: #ff6b62; }
.empty { padding: 18px 12px; color: var(--muted); }

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,.08); }
td { padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,.05); vertical-align: middle; }
tbody tr.m { cursor: pointer; }
tbody tr.m:hover td { background: rgba(255,255,255,.04); }
tr.sel td { background: rgba(255,255,255,.09) !important; }
tr.grp td { background: rgba(0,0,0,.18); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 5px 10px; }
td.num { text-align: right; color: var(--muted); white-space: nowrap; }
table.modt { table-layout: fixed; }
.cb { width: 15px; height: 15px; border: 1px solid rgba(255,255,255,.35); border-radius: 3px; display: inline-grid; place-items: center; vertical-align: middle; background: rgba(0,0,0,.25); cursor: pointer; }
.cb.on { background: var(--ink); border-color: var(--ink); }
.cb.on::after { content: ""; width: 7px; height: 4px; border-left: 2px solid #121010; border-bottom: 2px solid #121010; transform: rotate(-45deg) translate(1px,-1px); }
.locked .cb, .busy .cb { opacity: .4; pointer-events: none; }
.thumb { width: 48px; height: 27px; object-fit: cover; border-radius: 4px; background: #211e1e; flex: none; display: grid; place-items: center; color: var(--muted); font-size: 10px; }
.modname { display: flex; align-items: center; gap: 10px; white-space: nowrap; overflow: hidden; }
.modname span { overflow: hidden; text-overflow: ellipsis; }
.tag { font-size: 11px; color: var(--amber); white-space: nowrap; }
.tag.bad { color: #ff6b62; }
.kind { display: inline-block; min-width: 62px; text-align: center; font-size: 10px; font-weight: 600; letter-spacing: .08em; padding: 1px 4px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); margin-right: 8px; }
.kind.patch { color: var(--amber); border-color: rgba(233,162,59,.4); } .kind.official { color: var(--ink); border-color: rgba(255,255,255,.25); }

/* dashboard */
.band { position: relative; height: 120px; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,.09); margin-bottom: 12px; background: #1a1717 url("banner.jpg") center / cover; }
.band .cap { position: absolute; left: 0; bottom: 0; background: rgba(12,10,10,.6); backdrop-filter: blur(12px); padding: 6px 12px; font-size: 12px; border-top-right-radius: 8px; }
.dash { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; align-items: start; }
.news td:first-child { width: 72px; color: var(--muted); white-space: nowrap; vertical-align: top; padding-top: 9px; }
.news tr { cursor: pointer; }
.news tr:hover td { background: rgba(255,255,255,.04); }
.news b { font-weight: 500; }
.news .src { color: var(--muted); font-size: 12px; }
.unread { display: inline-block; width: 7px; height: 7px; background: var(--amber); border-radius: 2px; margin-right: 6px; vertical-align: 1px; }
.alerts td:last-child { text-align: right; white-space: nowrap; }

/* mods */
.searchrow { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.searchrow input, .searchrow select, select.inp, input.inp { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 6px; padding: 5px 8px; }
.searchrow input { flex: 1 1 220px; }
.modsgrid { display: grid; grid-template-columns: 1fr 320px; gap: 12px; align-items: start; }
.lockbanner { display: none; margin-bottom: 10px; padding: 7px 10px; border-radius: 8px; background: rgba(233,162,59,.1); border: 1px solid rgba(233,162,59,.35); color: var(--amber); }
.locked .lockbanner { display: block; }
.detail img, .detail .noimg { width: 100%; height: 170px; object-fit: cover; display: block; border-bottom: 1px solid var(--line); background: #1a1717; }
.detail .in { padding: 10px 12px 12px; display: grid; gap: 10px; }
.detail h3 { font: 28px/1 var(--display); letter-spacing: .03em; margin: 0; font-weight: normal; }
.detail dl { display: grid; grid-template-columns: 96px 1fr; gap: 3px 10px; margin: 0; }
.detail dt { color: var(--muted); } .detail dd { margin: 0; }
.detail ul { margin: 4px 0 0; padding-left: 16px; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; }

/* options */
.form { display: grid; grid-template-columns: 220px 1fr; }
.form > div { padding: 7px 10px; border-bottom: 1px solid rgba(255,255,255,.05); display: flex; align-items: center; gap: 8px; min-height: 38px; min-width: 0; }
.form .note { color: var(--muted); font-size: 12px; }
.form code { font-family: Consolas, monospace; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; flex: 0 1 auto; min-width: 0; }
.form .btn { flex: none; }
.chk { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }

/* status bar */
.status { grid-column: 2; display: flex; align-items: center; gap: 14px; padding: 0 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; }
.prog { width: 120px; height: 5px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; display: none; }
.prog.on { display: block; }
.prog i { display: block; height: 100%; background: var(--red); width: 0; transition: width .2s; }
.status .r { margin-left: auto; }

/* dialogs */
.scrim { position: fixed; inset: 0; background: rgba(6,5,5,.5); backdrop-filter: blur(6px); display: none; place-items: center; z-index: 50; padding: 20px; }
.scrim.open { display: grid; }
.dlg { width: min(500px, 100%); background: rgba(30,26,26,.82); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; overflow: hidden; backdrop-filter: blur(30px) saturate(150%); box-shadow: 0 24px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08); }
.dlg .ph { font-size: 12px; color: var(--ink); }
.dlg .in { padding: 14px; display: grid; gap: 10px; white-space: pre-line; }
.dlg .foot { padding: 10px 14px; border-top: 1px solid rgba(255,255,255,.07); display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.langs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.langs button { display: grid; gap: 12px; justify-items: center; padding: 20px 12px 16px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; }
.langs button:hover { background: rgba(255,255,255,.11); border-color: rgba(255,255,255,.28); }
.langs svg { width: 120px; height: 80px; border-radius: 4px; box-shadow: 0 0 0 1px rgba(255,255,255,.15); }
.langs b { font: 30px/1 var(--display); letter-spacing: .05em; font-weight: normal; }
.note2 { text-align: center; color: var(--muted); font-size: 12px; }
.toast { position: fixed; right: 14px; bottom: 38px; width: 360px; background: rgba(30,26,26,.85); border: 1px solid rgba(255,107,98,.5); border-radius: 12px; z-index: 60; display: none; backdrop-filter: blur(24px); }
.toast.show { display: block; }
.toast .in { padding: 10px 12px; display: grid; gap: 8px; overflow-wrap: anywhere; max-height: 40vh; overflow: auto; }
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="app" id="app">
  <nav class="side glass-pane">
    <div><div class="brand"><div class="fit" data-fit>RESCUE OPS</div><div class="fit red" data-fit>MOD LAUNCHER</div></div><div class="stripe"></div></div>
    <div class="navs">
      <button class="nav" data-screen="dashboard"><span data-t="nav.dashboard"></span></button>
      <button class="nav" data-screen="mods"><span data-t="nav.mods"></span><small id="nav-updates"></small></button>
      <button class="nav" data-screen="options"><span data-t="nav.options"></span></button>
    </div>
    <div></div>
    <div class="playbox">
      <div class="info" id="play-summary"></div>
      <button class="play" id="play" data-t="play"></button>
      <div class="info" id="play-info"></div>
    </div>
  </nav>

  <main class="main">
    <div class="tabs glass-pane" id="tabs"></div>

    <section class="screen" id="screen-dashboard">
      <div class="band"><div class="cap" id="band-cap"></div></div>
      <div class="dash">
        <div class="panel"><div class="ph"><span data-t="dash.news"></span><span class="r" id="news-count"></span></div><table class="news"><tbody id="news"></tbody></table></div>
        <div>
          <div class="panel"><div class="ph" data-t="dash.alerts"></div><table class="alerts"><tbody id="alerts"></tbody></table></div>
          <div class="panel"><div class="ph"><span data-t="dash.loads"></span><span class="r" id="loads-size"></span></div><table><tbody id="loads"></tbody></table></div>
        </div>
      </div>
    </section>

    <section class="screen" id="screen-mods">
      <div class="lockbanner" data-t="mods.locked"></div>
      <div class="searchrow">
        <input id="q" type="search" data-tp="mods.search">
        <select id="f-cat"></select>
        <select id="f-author"></select>
        <select id="f-sort"></select>
        <button class="btn" id="add-files" data-t="mods.add"></button>
      </div>
      <div class="modsgrid">
        <div>
          <div class="sub on" id="mods-loaded"><div class="panel"><div class="ph"><span data-t="mods.loaded"></span><span class="r" id="loaded-sum"></span></div><table class="modt"><thead id="th1"></thead><tbody id="list-loaded"></tbody></table></div></div>
          <div class="sub" id="mods-all"><div class="panel"><div class="ph"><span data-t="mods.all"></span><span class="r" id="all-sum"></span></div><table class="modt"><thead id="th2"></thead><tbody id="list-all"></tbody></table></div></div>
          <div class="sub" id="mods-updates"><div class="panel"><div class="ph"><span data-t="mods.updates"></span><span class="r"><button class="btn red" id="update-all" data-t="mods.updateAll"></button></span></div><table><tbody id="list-updates"></tbody></table></div></div>
        </div>
        <aside class="panel detail" id="detail"></aside>
      </div>
    </section>

    <section class="screen" id="screen-options">
      <div class="sub on" id="opt-launcher">
        <div class="panel"><div class="ph" data-t="opt.config"></div><div class="form">
          <div data-t="opt.language"></div><div><select class="inp" id="o-language"><option value="en">English</option><option value="fr">Français</option></select></div>
          <div data-t="opt.after"></div><div><select class="inp" id="o-after"></select></div>
          <div data-t="opt.startPage"></div><div><select class="inp" id="o-start"></select></div>
          <div></div><div><label class="chk" id="o-updates"><span class="cb"></span><span data-t="opt.checkUpdates"></span></label></div>
        </div></div>
        <div class="panel"><div class="ph" data-t="opt.compat"></div><div class="form">
          <div></div><div><label class="chk" id="o-smooth"><span class="cb"></span><span data-t="opt.smooth"></span></label><span class="note" data-t="opt.smoothNote"></span></div>
        </div></div>
      </div>
      <div class="sub" id="opt-game">
        <div class="panel"><div class="ph" data-t="opt.game"></div><div class="form">
          <div data-t="opt.gameFolder"></div><div><code id="o-game"></code><button class="btn" id="o-pick" data-t="opt.change"></button></div>
          <div data-t="opt.edition"></div><div id="o-edition"></div>
          <div data-t="opt.paks"></div><div><code id="o-paks"></code><button class="btn" data-folder="paks" data-t="opt.open"></button></div>
          <div data-t="opt.library"></div><div><code id="o-lib"></code><button class="btn" data-folder="library" data-t="opt.open"></button></div>
          <div></div><div class="note" data-t="opt.libraryNote"></div>
        </div></div>
      </div>
      <div class="sub" id="opt-help">
        <div class="panel"><div class="ph" data-t="opt.trouble"></div><div class="form">
          <div data-t="opt.diag"></div><div><button class="btn" id="o-diag" data-t="opt.copy"></button><span class="note" data-t="opt.diagNote"></span></div>
          <div data-t="opt.logs"></div><div><button class="btn" data-folder="logs" data-t="opt.openFolder"></button></div>
          <div data-t="opt.refresh"></div><div><button class="btn" id="o-refresh" data-t="opt.checkNow"></button></div>
        </div></div>
        <div class="panel"><div class="ph" data-t="opt.about"></div><div class="form">
          <div data-t="opt.version"></div><div id="o-version"></div>
          <div data-t="opt.by"></div><div><a href="#" data-url="https://rescueopsmodding.vercel.app">rescueopsmodding.vercel.app</a> · <a href="#" data-url="https://patreon.com/Tonnie001">Patreon</a></div>
          <div></div><div class="note" data-t="opt.disclaimer"></div>
          <div></div><div class="note" data-t="opt.credits"></div>
        </div></div>
      </div>
    </section>
  </main>

  <footer class="status glass-pane"><span id="status-text"></span><div class="prog" id="prog"><i></i></div><span class="r" id="game-info"></span></footer>
</div>

<div class="scrim" id="dlg-ask" role="dialog" aria-modal="true"><div class="dlg"><div class="ph" id="ask-title"></div><div class="in" id="ask-text"></div><div class="foot" id="ask-buttons"></div></div></div>
<div class="scrim" id="dlg-lang" role="dialog" aria-modal="true"><div class="dlg" style="width:min(460px,100%)"><div class="ph">Choose your language · Choisissez votre langue</div><div class="in" style="white-space:normal">
  <div class="langs">
    <button data-lang="en"><svg viewBox="0 0 60 30"><clipPath id="uk-s"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="uk-t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#uk-s)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#uk-t)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg><b>ENGLISH</b></button>
    <button data-lang="fr"><svg viewBox="0 0 3 2"><rect width="1" height="2" fill="#0055A4"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#EF4135"/></svg><b>FRANÇAIS</b></button>
  </div>
  <div class="note2">You can change this later in Options · Modifiable plus tard dans Options</div></div></div></div>
<div class="toast" id="toast" role="alert"><div class="ph"><span data-t="error"></span><span class="r"><button class="btn" id="toast-close">×</button></span></div><div class="in" id="toast-text"></div></div>

    var ups = mods().filter(function (m) { return m.state === 'UpdateAvailable'; });
    $('update-all').disabled = !ups.length || S.busy || S.running;
    $('list-updates').innerHTML = ups.length ? ups.map(function (m) {
      var c = (m.changelog || []).filter(function (e) { return e.version === m.version; })[0];
      return '<tr class="m" data-id="' + esc(m.id) + '"><td><div class="modname">' + thumb(m.thumb) + esc(m.name) + '</div></td><td class="dim">' + esc(m.author) + '</td><td>' + esc(m.version) +
        '</td><td class="dim">' + esc(c && c.notes ? c.notes.join('; ') : '') + '</td><td style="text-align:right"><button class="btn" data-act="update" data-id="' + esc(m.id) + '"' + (S.busy || S.running ? ' disabled' : '') + '>' + esc(t('b.update')) + '</button></td></tr>';
    }).join('') : '<tr><td class="empty">' + esc(t('mods.noUpdates')) + '</td></tr>';
    renderDetail();
  }

  function renderDetail() {
    var el = $('detail'), id = S.selected, m = id ? modById(id) : null, l = id ? localById(id) : null;
    var dis = S.busy || S.running ? ' disabled' : '';
    if (!m && !l) { el.innerHTML = '<div class="ph">' + esc(t('d.status')) + '</div><div class="empty">' + esc(t('d.pick')) + '</div>'; return; }
    if (l) {
      el.innerHTML = '<div class="ph">' + esc(t('local')) + '</div><div class="noimg"></div><div class="in"><h3>' + esc(l.name) + '</h3>' +
        '<dl><dt>' + esc(t('d.author')) + '</dt><dd>' + esc(t('local')) + '</dd><dt>' + esc(t('d.status')) + '</dt><dd>' + esc(l.loaded ? t('d.loaded') : t('d.available')) + '</dd>' +
        '<dt>' + esc(t('d.files')) + '</dt><dd>' + esc(l.files.join(', ')) + '</dd><dt>' + esc(t('d.size')) + '</dt><dd>' + esc(size(l.size)) + '</dd></dl>' +
        '<div class="acts"><button class="btn red" data-act="' + (l.loaded ? 'unload' : 'load') + '" data-id="' + esc(l.id) + '"' + dis + '>' + esc(t(l.loaded ? 'b.unload' : 'b.load')) + '</button>' +
        '<button class="btn" data-act="remove" data-id="' + esc(l.id) + '"' + dis + '>' + esc(t('b.delete')) + '</button></div></div>';
      return;
    }
    var stText = m.state === 'Loaded' ? t('d.loaded') : m.state === 'Available' ? t('d.available') : m.state === 'NotDownloaded' ? t('d.notDownloaded') : t('d.outdated');
    var change = (m.changelog || []).filter(function (e) { return e.version === m.version; })[0];
    var main = m.state === 'NotDownloaded' ? ['load', 'b.install'] : m.state === 'UpdateAvailable' ? ['update', 'b.update'] : m.loaded ? ['unload', 'b.unload'] : ['load', 'b.load'];
    var list = function (a) { return a && a.length ? a.join(', ') : t('d.nothing'); };
    el.innerHTML = '<div class="ph">' + esc(catLabel(m.category)) + '</div>' + (m.thumb ? '<img src="' + esc(m.thumb) + '" alt="" onerror="this.outerHTML=\'<div class=noimg></div>\'">' : '<div class="noimg"></div>') +
      '<div class="in"><h3>' + esc(m.name.toUpperCase()) + '</h3>' + (m.description ? '<div>' + esc(m.description) + '</div>' : '') +
      '<dl><dt>' + esc(t('d.author')) + '</dt><dd>' + esc(m.author) + '</dd><dt>' + esc(t('d.version')) + '</dt><dd>' + esc(m.version) + '</dd>' +
      '<dt>' + esc(t('d.status')) + '</dt><dd>' + esc(stText) + '</dd>' +
      (m.requires.length ? '<dt>' + esc(t('d.needs')) + '</dt><dd>' + esc(list(m.requires)) + '</dd>' : '') +
      (m.includes.length ? '<dt>' + esc(t('d.includes')) + '</dt><dd>' + esc(list(m.includes)) + '</dd>' : '') +
      (m.conflicts.length ? '<dt>' + esc(t('d.clashes')) + '</dt><dd>' + esc(list(m.conflicts)) + '</dd>' : '') +
      (m.size ? '<dt>' + esc(t('d.size')) + '</dt><dd>' + esc(size(m.size)) + '</dd>' : '') + '</dl>' +
      (change && change.notes && change.notes.length ? '<div><span class="dim">' + esc(t('d.changes', { v: m.version })) + '</span><ul>' + change.notes.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' : '') +
      '<div class="acts"><button class="btn red" data-act="' + main[0] + '" data-id="' + esc(m.id) + '"' + dis + '>' + esc(t(main[1])) + '</button>' +
      (m.page ? '<button class="btn" data-url="' + esc(m.page) + '">' + esc(t('b.page')) + '</button>' : '') +
      (m.state !== 'NotDownloaded' ? '<button class="btn" data-act="remove" data-id="' + esc(m.id) + '"' + dis + '>' + esc(t('b.delete')) + '</button>' : '') + '</div></div>';
  }

  function syncOptions() {
    var s = S.settings;
    $('o-language').value = s.language || lang;
    $('o-after').value = s.afterStart || 'minimise';
    $('o-start').value = s.startPage || 'dashboard';
    $('o-updates').querySelector('.cb').classList.toggle('on', s.checkUpdates !== false);
    $('o-smooth').querySelector('.cb').classList.toggle('on', s.smoothGraphics !== false);
    $('o-version').textContent = s.version || '';
  }
  function renderOptionsData() {
    var st = S.state; if (!st) return;
    // Paths are cut from the left (direction: rtl) so the folder name stays visible; the marks keep the slashes in order.
    function path(el, p) { $(el).textContent = p ? '‎' + p + '‎' : '—'; $(el).title = p || ''; }
    path('o-game', st.game.folder); path('o-paks', st.game.paks); path('o-lib', st.game.library);
    $('o-edition').textContent = st.game.found ? t(st.game.isDemo ? 'edition.demo' : 'edition.full') + (st.game.appId ? ' (Steam app ' + st.game.appId + ')' : '') : '—';
  }

  // ---------------------------------------------------------------- dialogs
  // One question at a time: later ones wait until the open one is answered.
  var askQueue = [];
  function openAsk(id, title, text, buttons) {
    if ($('dlg-ask').classList.contains('open')) { askQueue.push([id, title, text, buttons]); return; }
    $('ask-title').textContent = title; $('ask-text').textContent = text;
    $('ask-buttons').innerHTML = buttons.map(function (b, i) { return '<button class="btn' + (i === 0 ? ' red' : '') + '" data-answer="' + i + '">' + esc(b) + '</button>'; }).join('');
    var dlg = $('dlg-ask'); dlg.dataset.id = id; dlg.classList.add('open');
    var first = dlg.querySelector('[data-answer]'); if (first) first.focus();
  }
  function answer(choice) {
    var dlg = $('dlg-ask'); if (!dlg.classList.contains('open')) return;
    dlg.classList.remove('open');
    if (dlg.dataset.id === 'launcherUpdate') { if (choice === 0) send('selfUpdate'); }
    else send('answer', { id: dlg.dataset.id, choice: String(choice) });
    if (askQueue.length) openAsk.apply(null, askQueue.shift());
  }
  function showError(text) { $('toast-text').textContent = text; $('toast').classList.add('show'); clearTimeout(showError.timer); showError.timer = setTimeout(function () { $('toast').classList.remove('show'); }, 9000); }

  // ---------------------------------------------------------------- events
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-screen],[data-sub],[data-toggle],[data-act],[data-url],[data-news],[data-folder],[data-answer],[data-lang],tr.m');
    if (!el) return;
    if (el.dataset.lang) { setLanguage(el.dataset.lang); $('dlg-lang').classList.remove('open'); askUpdate(); return; }
    if (el.dataset.answer !== undefined) { answer(+el.dataset.answer); return; }
    if (el.dataset.screen) { go(el.dataset.screen); return; }
    if (el.dataset.sub !== undefined && el.classList.contains('t')) { if (el.dataset.sub) { S.sub[S.screen] = el.dataset.sub; renderTabs(); } return; }
    if (el.dataset.toggle) {
      e.stopPropagation();
      var id = el.dataset.toggle, m = modById(id), l = localById(id), on = m ? m.loaded : l && l.loaded;
      S.selected = id; send(on ? 'unload' : 'load', { id: id }); return;
    }
    if (el.dataset.news) {
      var item = S.news.filter(function (x) { return x.id === el.dataset.news; })[0];
      if (item && item.unread) { item.unread = false; send('markRead', { ids: [item.id] }); renderDashboard(); }
      if (el.dataset.url) send('openUrl', { url: el.dataset.url });
      return;
    }
    if (el.dataset.url) { e.preventDefault(); send('openUrl', { url: el.dataset.url }); return; }
    if (el.dataset.folder) { send('openFolder', { which: el.dataset.folder }); return; }
    if (el.dataset.act) {
      var a = el.dataset.act, aid = el.dataset.id;
      if (a === 'pickGame') send('pickGame');
      else if (a === 'refresh') send('refresh');
      else if (a === 'selfUpdate') send('selfUpdate');
      else if (a === 'updateAll') send('update', { ids: [] });
      else if (a === 'update') send('update', { ids: [aid] });
      else if (a === 'dismissGame') { send('setOption', { key: 'dismissGameUpdated', value: true }); S.state.game.updated = false; render(); }
      else if (a === 'switch') send('switchReplaced', { id: aid });
      else send(a, { id: aid });
      return;
    }
    if (el.matches('tr.m')) { S.selected = el.dataset.id; renderMods(); }
  });
  $('play').addEventListener('click', function () { send('play'); });
  $('add-files').addEventListener('click', function () { send('addFiles'); });
  $('update-all').addEventListener('click', function () { send('update', { ids: [] }); });
  $('o-pick').addEventListener('click', function () { send('pickGame'); });
  $('o-diag').addEventListener('click', function () { send('copyDiagnostics'); });
  $('o-refresh').addEventListener('click', function () { send('refresh'); });
  $('toast-close').addEventListener('click', function () { $('toast').classList.remove('show'); });
  ['q', 'f-cat', 'f-author', 'f-sort'].forEach(function (id) { $(id).addEventListener('input', renderMods); });
  $('o-language').addEventListener('change', function () { setLanguage(this.value); });
  $('o-after').addEventListener('change', function () { send('setOption', { key: 'afterStart', value: this.value }); });
  $('o-start').addEventListener('change', function () { send('setOption', { key: 'startPage', value: this.value }); });
  $('o-updates').addEventListener('click', function () { send('setOption', { key: 'checkUpdates', value: !(S.settings.checkUpdates !== false) }); });
  $('o-smooth').addEventListener('click', function () { send('setOption', { key: 'smoothGraphics', value: !(S.settings.smoothGraphics !== false) }); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('dlg-ask').classList.contains('open')) answer(-1);
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f' && S.screen === 'mods') { e.preventDefault(); $('q').focus(); }
  });
  window.addEventListener('resize', fit);

  function setLanguage(l) {
    lang = l === 'fr' ? 'fr' : 'en';
    S.settings.language = lang;
    send('setOption', { key: 'language', value: lang });
    applyStrings(); render();
  }

  // ---------------------------------------------------------------- messages from C#
  var first = true;
  window.chrome.webview.addEventListener('message', function (e) {
    var ev = e.data.event, d = e.data.data;
    if (ev === 'settings') {
      S.settings = d;
      if (d.language) lang = d.language;
      applyStrings();
      if (first) { first = false; go(d.startPage === 'mods' ? 'mods' : 'dashboard'); if (!d.language) $('dlg-lang').classList.add('open'); }
      render();
    } else if (ev === 'state') { S.state = d; S.running = d.game.running; render(); }
    else if (ev === 'news') { S.news = d; renderDashboard(); }
    else if (ev === 'busy') { S.busy = d; render(); }
    else if (ev === 'gameRunning') { S.running = d; if (S.state) S.state.game.running = d; render(); }
    else if (ev === 'status') {
      $('status-text').textContent = d.text || '';
      clearTimeout(statusTimer);
      if (d.percent < 0 && d.text) statusTimer = setTimeout(function () { $('status-text').textContent = ''; }, 12000);
      $('prog').classList.toggle('on', d.percent >= 0);
      $('prog').firstChild.style.width = Math.max(0, d.percent) + '%';
    }
    else if (ev === 'ask') openAsk(d.id, d.title, d.text, d.buttons);
    else if (ev === 'error') showError(d.text);
    else if (ev === 'launcherUpdate') { pendingUpdate = d; if (!$('dlg-lang').classList.contains('open')) askUpdate(); }
  });
  var pendingUpdate = null, statusTimer = null;
  function askUpdate() {
    if (!pendingUpdate) return;
    var d = pendingUpdate; pendingUpdate = null;
    openAsk('launcherUpdate', t('upd.title'), t('upd.text', { v: d.version }) + (d.notes && d.notes.length ? '\n\n• ' + d.notes.join('\n• ') : ''), [t('upd.now'), t('upd.later')]);
  }

  applyStrings();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit); else fit();
  fit();
  send('ready');
})();
</script>
</body>
</html>
