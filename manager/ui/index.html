<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rescue Ops Mod Launcher</title>
<style>
@font-face { font-family: "Bebas Neue"; src: url("bebas.woff2") format("woff2"); font-display: block; }
@font-face { font-family: "Rubik"; src: url("rubik.woff2") format("woff2"); font-weight: 300 900; font-display: block; }
:root {
  --bg: #0b0a0a; --panel: rgba(26,22,22,.58); --bar: rgba(255,255,255,.04); --line: rgba(255,255,255,.08);
  --ink: #ece7e5; --muted: #9a918e; --red: #e92125; --amber: #e9a23b;
  --display: "Bebas Neue", "Arial Narrow", Impact, sans-serif; --body: "Rubik", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.4 var(--body); overflow: hidden; user-select: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 1px; }
a { color: inherit; }
.backdrop { position: fixed; inset: 0; z-index: -1; background: #0b0a0a url("backdrop.jpg") center / cover no-repeat; }
.backdrop::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,9,9,.25), rgba(10,9,9,.6)); }
.flat .backdrop { background: #121010; }
.app { display: grid; grid-template-columns: 240px 1fr; grid-template-rows: 1fr 28px; height: 100%; }

/* glass */
.glass-pane { background: rgba(18,15,15,.5); backdrop-filter: blur(24px) saturate(140%); }
.flat .glass-pane, .flat .panel, .flat .dlg, .flat .toast { backdrop-filter: none; background: #1a1717; }

/* sidebar */
.side { grid-row: 1 / 3; border-right: 1px solid var(--line); display: grid; grid-template-rows: auto auto 1fr auto; min-height: 0; }
.brand { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
.brand .fit { font-family: var(--display); line-height: .84; white-space: nowrap; }
.brand .fit.red { color: var(--red); margin-top: 4px; }
.stripe { height: 6px; background: repeating-linear-gradient(135deg, var(--red) 0 10px, #f2eeec 10px 20px); }
.navs { display: grid; padding: 10px 0; align-content: start; }
.nav { font: 26px/1 var(--display); letter-spacing: .04em; color: var(--muted); padding: 9px 12px 7px; margin: 1px 10px; border-radius: 8px;
  display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: none; border: 0; text-align: left; }
.nav:hover { color: var(--ink); background: rgba(255,255,255,.06); }
.nav.on { background: rgba(255,255,255,.14); color: var(--ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.1); }
.nav small { font: 12px var(--body); color: var(--amber); }
.playbox { border-top: 1px solid var(--line); padding: 12px; display: grid; gap: 8px; }
.playbox .info { font-size: 12px; color: var(--muted); }
.play { height: 64px; border: 0; border-radius: 10px; background: var(--red); color: #fff; font: 40px/1 var(--display); letter-spacing: .08em; padding-top: 4px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
.play:hover { background: #ff2a2e; }
.play:disabled { background: #3a3433; color: var(--muted); cursor: default; box-shadow: none; }
.playrow { display: flex; }
.playrow .play { flex: 1; border-radius: 10px 0 0 10px; }
.playrow .drop { width: 40px; border: 0; border-left: 1px solid rgba(0,0,0,.3); border-radius: 0 10px 10px 0; background: var(--red); color: #fff; font-size: 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
.playrow .drop:hover { background: #ff2a2e; }
.playrow .drop:disabled { background: #3a3433; color: var(--muted); cursor: default; box-shadow: none; }
.quick { position: fixed; left: 12px; width: 216px; bottom: 120px; z-index: 40; display: none; background: rgba(30,26,26,.92); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; overflow: hidden; backdrop-filter: blur(24px); box-shadow: 0 16px 40px rgba(0,0,0,.5); }
.quick.open { display: block; }
.quick .h { padding: 7px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border-bottom: 1px solid rgba(255,255,255,.07); }
.quick button { display: flex; width: 100%; justify-content: space-between; gap: 8px; padding: 8px 12px; background: none; border: 0; text-align: left; }
.quick button:hover { background: rgba(255,255,255,.08); }
.quick button span { color: var(--muted); font-size: 12px; white-space: nowrap; }

/* main */
.main { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
.tabs { display: flex; align-items: flex-end; gap: 2px; padding: 10px 16px 0; border-bottom: 1px solid var(--line); }
.tabs .t { padding: 7px 14px; color: var(--muted); border: 1px solid transparent; border-bottom: 0; background: none; text-transform: uppercase; font-size: 12px; letter-spacing: .06em; border-radius: 8px 8px 0 0; }
.tabs .t.on { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.1); color: var(--ink); margin-bottom: -1px; }
.tabs .right { margin-left: auto; padding-bottom: 7px; color: var(--muted); font-size: 12px; }
.screen { display: none; overflow: auto; min-height: 0; padding: 14px 16px 16px; }
.screen.on { display: block; }
.sub { display: none; } .sub.on { display: block; }

.panel { background: var(--panel); border: 1px solid rgba(255,255,255,.09); border-radius: 10px; overflow: hidden; backdrop-filter: blur(22px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
.panel + .panel { margin-top: 12px; }
.ph { background: var(--bar); border-bottom: 1px solid rgba(255,255,255,.06); padding: 6px 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; align-items: center; gap: 10px; min-height: 30px; }
.ph .r { margin-left: auto; font-weight: 400; text-transform: none; letter-spacing: 0; display: flex; gap: 6px; align-items: center; }
.btn { border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.06); padding: 4px 10px; border-radius: 6px; white-space: nowrap; }
.btn:hover { background: rgba(255,255,255,.11); }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.22); }
.btn.red:hover { background: #ff2a2e; }
.btn:disabled { opacity: .45; cursor: default; }
.warn { color: var(--amber); } .dim { color: var(--muted); } .bad { color: #ff6b62; }
.empty { padding: 18px 12px; color: var(--muted); }

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,.08); }
td { padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,.05); vertical-align: middle; }
tbody tr.m { cursor: pointer; }
tbody tr.m:hover td { background: rgba(255,255,255,.04); }
tr.sel td { background: rgba(255,255,255,.09) !important; }
tr.grp td { background: rgba(0,0,0,.18); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 5px 10px; }
td.num { text-align: right; color: var(--muted); white-space: nowrap; }
table.modt { table-layout: fixed; }
table.modt td.st, table.modt td.pop, table.modt td.dim { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cb { width: 15px; height: 15px; border: 1px solid rgba(255,255,255,.35); border-radius: 3px; display: inline-grid; place-items: center; vertical-align: middle; background: rgba(0,0,0,.25); cursor: pointer; }
.cb.on { background: var(--ink); border-color: var(--ink); }
.cb.on::after { content: ""; width: 7px; height: 4px; border-left: 2px solid #121010; border-bottom: 2px solid #121010; transform: rotate(-45deg) translate(1px,-1px); }
.locked .cb, .busy .cb { opacity: .4; pointer-events: none; }
.thumb { width: 48px; height: 27px; object-fit: cover; border-radius: 4px; background: #211e1e; flex: none; display: grid; place-items: center; color: var(--muted); font-size: 10px; }
.modname { display: flex; align-items: center; gap: 10px; white-space: nowrap; overflow: hidden; }
.modname span { overflow: hidden; text-overflow: ellipsis; }
.tag { font-size: 11px; color: var(--amber); white-space: nowrap; }
.tag.bad { color: #ff6b62; }
.kind { display: inline-block; min-width: 62px; text-align: center; font-size: 10px; font-weight: 600; letter-spacing: .08em; padding: 1px 4px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); margin-right: 8px; }
.kind.patch { color: var(--amber); border-color: rgba(233,162,59,.4); } .kind.official { color: var(--ink); border-color: rgba(255,255,255,.25); }

/* dashboard */
/* The key art is small (616 px), so it's shown whole on the right over a blurred copy of itself. */
.hero { position: relative; height: 230px; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,.09); margin-bottom: 12px; background: #1a1717; display: flex; }
.hero::before { content: ""; position: absolute; inset: -30px; background: url("hero.jpg") center / cover; filter: blur(26px) brightness(.45) saturate(1.2); }
.hero .art { position: relative; margin-left: auto; height: 100%; aspect-ratio: 616 / 353; background: url("hero.jpg") center / cover;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%); mask-image: linear-gradient(90deg, transparent, #000 22%); }
.hero .txt { position: absolute; left: 0; top: 0; bottom: 0; padding: 22px 24px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; max-width: 55%; }
.hero h2 { font: 52px/.9 var(--display); letter-spacing: .03em; margin: 0; font-weight: normal; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
.hero .sub2 { color: #d6cfcc; font-size: 12px; }
.hero .acts { margin-top: 4px; }
.alertlist { border-color: rgba(233,162,59,.35); margin-bottom: 12px; }
.alertlist .al { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,.05); }
.alertlist .al:last-child { border-bottom: 0; }
.alertlist .al > div { flex: 1; min-width: 0; }
.dash { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; padding: 10px; }
.tile { cursor: pointer; border-radius: 6px; overflow: hidden; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.07); }
.tile:hover { border-color: rgba(255,255,255,.22); }
.tile .ti { aspect-ratio: 16 / 9; background: #211e1e; display: grid; place-items: center; color: var(--muted); font-size: 11px; }
.tile .ti img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .tn { padding: 6px 8px 7px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .tn small { display: block; color: var(--muted); font-size: 11px; }
.tile .tn .tag { font-size: 11px; }
.nitem { padding: 9px 12px; border-bottom: 1px solid rgba(255,255,255,.05); cursor: pointer; display: grid; gap: 3px; }
.nitem:hover { background: rgba(255,255,255,.04); }
.nitem .nm { display: flex; align-items: center; font-size: 11px; color: var(--muted); }
.nitem .nt { font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.nitem .ns { color: var(--muted); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.nmore { display: block; padding: 8px 12px; color: var(--muted); font-size: 12px; text-decoration: none; }
.nmore:hover { color: var(--ink); }
.unread { display: inline-block; width: 7px; height: 7px; background: var(--amber); border-radius: 2px; margin-right: 6px; vertical-align: 1px; }

/* mods */
.searchrow { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.searchrow input, .searchrow select, select.inp, input.inp { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 6px; padding: 5px 8px; }
.searchrow input { flex: 1 1 220px; }
.modsgrid { display: grid; grid-template-columns: 1fr 320px; gap: 12px; align-items: start; }
.lockbanner { display: none; margin-bottom: 10px; padding: 7px 10px; border-radius: 8px; background: rgba(233,162,59,.1); border: 1px solid rgba(233,162,59,.35); color: var(--amber); }
.locked .lockbanner { display: block; }
.seg { display: inline-flex; border: 1px solid rgba(255,255,255,.1); border-radius: 6px; overflow: hidden; }
.seg button { background: rgba(255,255,255,.04); border: 0; padding: 4px 10px; color: var(--muted); }
.seg button + button { border-left: 1px solid rgba(255,255,255,.1); }
.seg button.on { background: rgba(255,255,255,.14); color: var(--ink); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; padding: 10px; }
.cgrp { grid-column: 1 / -1; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 4px 2px 0; }
.cgrp:not(:first-child) { padding-top: 10px; }
.card { cursor: pointer; border-radius: 8px; overflow: hidden; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.08); display: flex; flex-direction: column; }
.card:hover { border-color: rgba(255,255,255,.22); background: rgba(255,255,255,.06); }
.card.sel { border-color: rgba(255,255,255,.7); background: rgba(255,255,255,.08); }
.card .ci { position: relative; aspect-ratio: 16 / 9; background: #211e1e; display: grid; place-items: center; color: var(--muted); font-size: 11px; }
.card .ci img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.card .ci .cb { position: absolute; top: 8px; left: 8px; width: 20px; height: 20px; background: rgba(10,9,9,.6); border-color: rgba(255,255,255,.65); }
.card .ci .cb.on { background: var(--ink); border-color: var(--ink); }
.card .ci .sz { position: absolute; right: 6px; bottom: 6px; font-size: 11px; background: rgba(10,9,9,.7); padding: 1px 6px; border-radius: 4px; color: #d6cfcc; }
.card .cbd { padding: 8px 10px 9px; display: grid; gap: 2px; }
.card .cn { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .cm { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .cs { font-size: 12px; min-height: 17px; }
.detail .shot { display: block; position: relative; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
.detail .shot .n { position: absolute; right: 8px; bottom: 8px; font-size: 11px; background: rgba(10,9,9,.7); padding: 2px 7px; border-radius: 4px; color: #d6cfcc; }
.detail .shot:hover .n { color: #fff; }
.detail img, .detail .noimg { width: 100%; height: 170px; object-fit: cover; display: block; border-bottom: 1px solid var(--line); background: #1a1717; }
.detail .in { padding: 10px 12px 12px; display: grid; gap: 10px; }
.detail h3 { font: 28px/1 var(--display); letter-spacing: .03em; margin: 0; font-weight: normal; }
.detail dl { display: grid; grid-template-columns: 96px 1fr; gap: 3px 10px; margin: 0; }
.detail dt { color: var(--muted); } .detail dd { margin: 0; }
.detail ul { margin: 4px 0 0; padding-left: 16px; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; }

.detail details summary { cursor: pointer; color: var(--muted); }
.detail details summary:hover { color: var(--ink); }
.detail .hist { margin-top: 6px; display: grid; gap: 6px; }

.stars { color: var(--amber); letter-spacing: 1px; white-space: nowrap; }
.stars .off { color: rgba(255,255,255,.2); }
.pop { color: var(--muted); font-size: 12px; white-space: nowrap; }
.pop b { color: var(--ink); font-weight: 500; }
.card .cr { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--muted); }
.myrate { display: inline-flex; gap: 2px; }
.myrate button { background: none; border: 0; padding: 0 1px; font-size: 20px; line-height: 1; color: rgba(255,255,255,.22); }
.myrate button.on, .myrate:hover button { color: var(--amber); }
.myrate button:hover ~ button { color: rgba(255,255,255,.22); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; font-size: 12px; }
.linkbtn:hover { color: var(--ink); }
#dlg-reg .in { white-space: normal; }
#dlg-reg label.f { display: grid; gap: 4px; color: var(--muted); font-size: 12px; }
#dlg-reg .chk { align-items: flex-start; }
#dlg-reg .chk .cb { flex: none; margin-top: 2px; }
#reg-err { color: #ff6b62; }

/* presets */
.presets td { vertical-align: middle; }
.presets td:nth-child(2) { color: var(--muted); }
.presets td:last-child { text-align: right; white-space: nowrap; }
.presets td:last-child .btn { margin-left: 4px; }
.presets tr.cur td:first-child::after { content: attr(data-cur); color: var(--muted); margin-left: 6px; font-size: 12px; }
.importrow { display: flex; gap: 8px; padding: 10px; flex-wrap: wrap; align-items: center; }
.importrow input { flex: 1 1 260px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 6px; padding: 5px 8px; font-family: Consolas, monospace; font-size: 12px; }
.dlg input.inp { width: 100%; }

/* options */
.form { display: grid; grid-template-columns: 220px 1fr; }
.form > div { padding: 7px 10px; border-bottom: 1px solid rgba(255,255,255,.05); display: flex; align-items: center; gap: 8px; min-height: 38px; min-width: 0; }
.form .note { color: var(--muted); font-size: 12px; }
.form code { font-family: Consolas, monospace; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; flex: 0 1 auto; min-width: 0; }
.form .btn { flex: none; }
.chk { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }

/* status bar */
.status { grid-column: 2; display: flex; align-items: center; gap: 14px; padding: 0 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; }
.prog { width: 120px; height: 5px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; display: none; }
.prog.on { display: block; }
.prog i { display: block; height: 100%; background: var(--red); width: 0; transition: width .2s; }
.status .r { margin-left: auto; }

/* dialogs */
.scrim { position: fixed; inset: 0; background: rgba(6,5,5,.5); backdrop-filter: blur(6px); display: none; place-items: center; z-index: 50; padding: 20px; }
.scrim.open { display: grid; }
.dlg { width: min(500px, 100%); background: rgba(30,26,26,.82); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; overflow: hidden; backdrop-filter: blur(30px) saturate(150%); box-shadow: 0 24px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08); }
.dlg .ph { font-size: 12px; color: var(--ink); }
.dlg .in { padding: 14px; display: grid; gap: 10px; white-space: pre-line; }
.dlg .foot { padding: 10px 14px; border-top: 1px solid rgba(255,255,255,.07); display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.langs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.langs button { display: grid; gap: 12px; justify-items: center; padding: 20px 12px 16px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; }
.langs button:hover { background: rgba(255,255,255,.11); border-color: rgba(255,255,255,.28); }
.langs svg { width: 120px; height: 80px; border-radius: 4px; box-shadow: 0 0 0 1px rgba(255,255,255,.15); }
.langs b { font: 30px/1 var(--display); letter-spacing: .05em; font-weight: normal; }
.note2 { text-align: center; color: var(--muted); font-size: 12px; }
.toast { position: fixed; right: 14px; bottom: 38px; width: 360px; background: rgba(30,26,26,.85); border: 1px solid rgba(255,107,98,.5); border-radius: 12px; z-index: 60; display: none; backdrop-filter: blur(24px); }
.toast.show { display: block; }
.lb { background: rgba(6,5,5,.88); grid-template-rows: 1fr auto; gap: 12px; padding: 40px 70px 16px; }
.lb.open { display: grid; }
.lb .stage { min-height: 0; display: grid; place-items: center; }
.lb .stage img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.lb .bar { display: flex; gap: 8px; justify-content: center; align-items: center; }
.lb .bar img { width: 72px; height: 40px; object-fit: cover; border-radius: 4px; opacity: .5; cursor: pointer; border: 1px solid transparent; }
.lb .bar img.on { opacity: 1; border-color: var(--ink); }
.lb .cnt { color: var(--muted); font-size: 12px; margin-left: 8px; }
.lb .lbn, .lb .lbx { position: absolute; border: 1px solid rgba(255,255,255,.15); background: rgba(30,26,26,.7); color: var(--ink); border-radius: 8px; font-size: 26px; line-height: 1; }
.lb .lbn { top: 50%; width: 44px; height: 64px; margin-top: -32px; }
.lb .lbn:hover, .lb .lbx:hover { background: rgba(60,54,54,.85); }
.lb .prev { left: 14px; } .lb .next { right: 14px; }
.lb .lbx { top: 10px; right: 14px; width: 36px; height: 36px; font-size: 22px; }
/* dashboard columns start level (the second panel isn't pushed down by .panel + .panel) */
.dash > .panel + .panel { margin-top: 0; }
.tag.new { color: #fff; background: var(--red); padding: 0 5px; border-radius: 3px; font-size: 10px; font-weight: 600; letter-spacing: .06em; vertical-align: 1px; }
.mine { color: var(--muted); font-size: 11px; }
/* mod dev */
.devhero { padding: 22px 24px; display: grid; gap: 12px; }
.devhero h2 { font: 44px/.9 var(--display); letter-spacing: .03em; margin: 0; font-weight: normal; }
.devhero ol { margin: 0; padding-left: 18px; display: grid; gap: 4px; color: #d6cfcc; }
.devform { display: grid; grid-template-columns: 170px 1fr; }
.devform > div { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,.05); min-width: 0; }
.devform > div:nth-child(odd) { color: var(--muted); padding-top: 13px; }
.devform .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
.devform input.inp, .devform select.inp, textarea.inp { width: 100%; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 6px; padding: 6px 8px; }
textarea.inp { min-height: 84px; resize: vertical; font: inherit; color: inherit; }
input, textarea { user-select: text; }
.dropzone { border: 1px dashed rgba(255,255,255,.25); border-radius: 8px; padding: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--muted); }
.dropzone.over { border-color: rgba(255,255,255,.7); background: rgba(255,255,255,.07); }
.dragging .dropzone { border-color: rgba(255,255,255,.45); }
.flist { width: 100%; display: grid; gap: 2px; font-family: Consolas, monospace; font-size: 12px; color: var(--ink); }
.flist:empty { display: none; }
.flist div { display: flex; gap: 8px; align-items: center; }
.flist .x, .pics .x { background: none; border: 0; color: var(--muted); padding: 0 4px; }
.flist .x:hover, .pics .x:hover { color: var(--ink); }
.pics { display: flex; gap: 8px; flex-wrap: wrap; width: 100%; }
.pics:empty { display: none; }
.pics figure { margin: 0; position: relative; }
.pics img { width: 160px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; display: block; border: 1px solid var(--line); }
.pics .x { position: absolute; top: 3px; right: 3px; background: rgba(10,9,9,.75); border-radius: 4px; }
.picklist { max-height: 150px; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 3px 12px; padding: 4px 0 8px; }
.picklist .chk { font-size: 12px; }
.devform details summary { cursor: pointer; color: var(--muted); padding-top: 5px; }
.devfoot { padding: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.devfoot .dim { flex: 1 1 300px; }
.inbox .msg { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.05); display: grid; gap: 4px; }
.inbox .msg .mh { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.inbox .msg .mt { white-space: pre-wrap; user-select: text; }
.recovery { font: 30px/1 Consolas, monospace; letter-spacing: .08em; text-align: center; padding: 14px; background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 8px; user-select: all; }
.st-live { color: #7fd17f; } .st-wait { color: var(--amber); } .st-no { color: #ff6b62; }
.dropover { position: fixed; inset: 0; z-index: 70; display: none; place-items: center; background: rgba(6,5,5,.55); pointer-events: none; }
.dropover div { font: 34px/1 var(--display); letter-spacing: .04em; padding: 22px 30px; border: 2px dashed rgba(255,255,255,.6); border-radius: 14px; background: rgba(30,26,26,.85); }
.dragging.droplib .dropover { display: grid; }
.toast .in { padding: 10px 12px; display: grid; gap: 8px; overflow-wrap: anywhere; max-height: 40vh; overflow: auto; }
</style>

  function filtered(list) {

    });

  // The same grouping drives both views; grid = cards under category headings, list = table rows under group rows.
  function grouped(list, locals, emptyText) {

    var item = grid ? card : row, localItem = grid ? localCard : localRow;
    var grp = function (label) { return grid ? '<div class="cgrp">' + esc(label) + '</div>' : '<tr class="grp"><td colspan="7">' + esc(label) + '</td></tr>'; };
    var sort = $('f-sort').value, html = '';
    if (!list.length && !locals.length) return grid ? '<div class="empty">' + esc(emptyText) + '</div>'
      : '<table class="modt"><thead>' + head() + '</thead><tbody><tr><td colspan="7" class="empty">' + esc(emptyText) + '</td></tr></tbody></table>';
    if (sort !== 'category') {
      var sv = function (m) { var x = stat(m.id) || {}; return sort === 'downloads' ? x.downloads || 0 : sort === 'rating' ? (x.rating || 0) * 1000 + (x.ratings || 0) : sort === 'newest' ? (m.isNew ? 1e13 : 0) + (m.added ? Date.parse(m.added) : 0) : 0; };

      html = list.map(item).join('');
    } else {
      var cats = [];
      list.forEach(function (m) { if (cats.indexOf(m.category) < 0) cats.push(m.category); });
      cats.sort(function (a, b) { return (a === 'Tools' || a === 'Other') - (b === 'Tools' || b === 'Other') || a.localeCompare(b); });
      cats.forEach(function (c) { html += grp(catLabel(c)) + list.filter(function (m) { return m.category === c; }).map(item).join(''); });

    else if (ev === 'devImages') { if (d.which === 'thumb') UP.thumb = d.items[0]; else UP.shots = UP.shots.concat(d.items).slice(0, 6); renderUpload(); }
    else if (ev === 'devSubmitResult') {
      if (d.ok) { note(t('up.done', { m: d.name })); resetUpload(); go('dev', 'dev-mine'); }
      else { $('up-err').textContent = d.error; $('up-send').disabled = false; }
    }
    else if (ev === 'sent') {
      if (d.ok) { $('dlg-msg').classList.remove('open'); note(t(d.what === 'report' ? 'msg.sentReport' : 'msg.sentFeedback')); }
      else if (d.error === 'register') { $('dlg-msg').classList.remove('open'); openReg({ then: function () { openMsg(MSG.what, MSG.modId); } }); }
      else { $('msg-err').textContent = d.error; $('msg-send').disabled = false; }
    }
    else if (ev === 'whatsNew') openAsk('whatsNew', t('new.title', { v: d.version }), t('new.text', { v: d.version }) + '\n\n• ' + d.notes.join('\n• '), [t('ok')]);
    else if (ev === 'busy') { S.busy = d; render(); }
    else if (ev === 'gameRunning') { S.running = d; if (S.state) S.state.game.running = d; render(); }
    else if (ev === 'status') {
      $('status-text').textContent = d.text || '';
      clearTimeout(statusTimer);
      if (d.percent < 0 && d.text) statusTimer = setTimeout(function () { $('status-text').textContent = ''; }, 12000);
      $('prog').classList.toggle('on', d.percent >= 0);
      $('prog').firstChild.style.width = Math.max(0, d.percent) + '%';
    }
    else if (ev === 'ask') openAsk(d.id, d.title, d.text, d.buttons);
    else if (ev === 'error') showError(d.text);
    else if (ev === 'launcherUpdate') { pendingUpdate = d; if (!$('dlg-lang').classList.contains('open')) askUpdate(); }
  });
  var pendingUpdate = null, statusTimer = null;
  function askUpdate() {
    if (!pendingUpdate) return;
    var d = pendingUpdate; pendingUpdate = null;
    openAsk('launcherUpdate', t('upd.title'), t('upd.text', { v: d.version }) + (d.notes && d.notes.length ? '\n\n• ' + d.notes.join('\n• ') : ''), [t('upd.now'), t('upd.later')]);
  }

  applyStrings();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit); else fit();
  fit();
  send('ready');
})();
</script>
</body>
